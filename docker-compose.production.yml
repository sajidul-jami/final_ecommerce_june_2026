services:
  mysql:
    image: mysql:8.4
    container_name: website2026-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ecommerce}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your production .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./new sql/sql_all.txt:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - website2026
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your production .env}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: website2026-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in your production .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in your production .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - website2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: website2026-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in your production .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in your production .env}
      MINIO_BUCKET: products
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    volumes:
      - ./scripts/minio-init.sh:/scripts/minio-init.sh:ro
    networks:
      - website2026
    restart: "no"

  user-backend:
    build:
      context: ./user/ecommerce_backend_2026
    image: website2026/user-backend:latest
    container_name: website2026-user-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3005
      NODE_ENV: production
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your production .env}
      DB_NAME: ${DB_NAME:-ecommerce}
      DB_PORT: 3306
      JWT_SECRET: ${USER_JWT_SECRET:?Set USER_JWT_SECRET in your production .env}
      CLIENT_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in your production .env}
      CORS_ORIGINS: ${USER_CORS_ORIGINS:-}
      PRODUCT_CACHE_REVALIDATION_SECRET: ${PRODUCT_CACHE_REVALIDATION_SECRET:?Set PRODUCT_CACHE_REVALIDATION_SECRET in your production .env}
      PRODUCT_CACHE_REVALIDATION_URL: http://user-frontend:3000/api/cache/products
      NGINX_PRODUCT_CACHE_PATH: /var/cache/nginx/product-pages
    expose:
      - "3005"
    volumes:
      - product_page_cache:/var/cache/nginx
    networks:
      - website2026
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-backend:
    build:
      context: ./admin/admin_panel_backend
    image: website2026/admin-backend:latest
    container_name: website2026-admin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in your production .env}
      CLIENT_URL: ${ADMIN_CLIENT_URL:?Set ADMIN_CLIENT_URL in your production .env}
      ADMIN_CLIENT_URL: ${ADMIN_CLIENT_URL:?Set ADMIN_CLIENT_URL in your production .env}
      CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-}
      PRODUCT_CACHE_REVALIDATION_SECRET: ${PRODUCT_CACHE_REVALIDATION_SECRET:?Set PRODUCT_CACHE_REVALIDATION_SECRET in your production .env}
      PRODUCT_CACHE_REVALIDATION_URL: http://user-frontend:3000/api/cache/products
      NGINX_PRODUCT_CACHE_PATH: /var/cache/nginx/product-pages
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your production .env}
      DB_NAME: ${DB_NAME:-ecommerce}
      DB_PORT: 3306
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in your production .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in your production .env}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?Set MINIO_PUBLIC_URL in your production .env}
    expose:
      - "3001"
    volumes:
      - product_page_cache:/var/cache/nginx
    networks:
      - website2026
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  user-frontend:
    build:
      context: ./user/ecommerce_frontend_2026
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_USER_API_BASE_URL:?Set NEXT_PUBLIC_USER_API_BASE_URL in your production .env}
        NEXT_PUBLIC_PRODUCT_IMAGE_BASE_URL: ${NEXT_PUBLIC_PRODUCT_IMAGE_BASE_URL:?Set NEXT_PUBLIC_PRODUCT_IMAGE_BASE_URL in your production .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in your production .env}
    image: website2026/user-frontend:latest
    container_name: website2026-user-frontend
    restart: unless-stopped
    depends_on:
      user-backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_USER_API_BASE_URL:?Set NEXT_PUBLIC_USER_API_BASE_URL in your production .env}
      NEXT_PUBLIC_PRODUCT_IMAGE_BASE_URL: ${NEXT_PUBLIC_PRODUCT_IMAGE_BASE_URL:?Set NEXT_PUBLIC_PRODUCT_IMAGE_BASE_URL in your production .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in your production .env}
    expose:
      - "3000"
    networks:
      - website2026
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx-cache-init:
    image: nginx:stable-alpine
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /var/cache/nginx/product-pages && chown -R nginx:nginx /var/cache/nginx/product-pages"]
    volumes:
      - product_page_cache:/var/cache/nginx
    restart: "no"

  nginx:
    image: nginx:stable-alpine
    container_name: website2026-nginx
    restart: unless-stopped
    depends_on:
      user-frontend:
        condition: service_healthy
      admin-frontend:
        condition: service_healthy
      user-backend:
        condition: service_healthy
      admin-backend:
        condition: service_healthy
      nginx-cache-init:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?Set SHOP_DOMAIN in your production .env}
      USER_API_DOMAIN: ${USER_API_DOMAIN:?Set USER_API_DOMAIN in your production .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in your production .env}
      ADMIN_API_DOMAIN: ${ADMIN_API_DOMAIN:?Set ADMIN_API_DOMAIN in your production .env}
    volumes:
      - ./nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/proxy-params.conf:/etc/nginx/conf.d/proxy-params.conf:ro
      - product_page_cache:/var/cache/nginx
    networks:
      - website2026
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  admin-frontend:
    build:
      context: ./admin/admin_panel_frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:?Set NEXT_PUBLIC_ADMIN_API_URL in your production .env}
        NEXT_PUBLIC_UPLOAD_URL: ${NEXT_PUBLIC_ADMIN_UPLOAD_URL:?Set NEXT_PUBLIC_ADMIN_UPLOAD_URL in your production .env}
        NEXT_PUBLIC_PRODUCT_IMAGE_BASE_URL: ${NEXT_PUBLIC_PRODUCT_IMAGE_BASE_URL:?Set NEXT_PUBLIC_PRODUCT_IMAGE_BASE_URL in your production .env}
    image: website2026/admin-frontend:latest
    container_name: website2026-admin-frontend
    restart: unless-stopped
    depends_on:
      admin-backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - website2026
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  website2026:
    driver: bridge

volumes:
  mysql_data:
  minio_data:
  product_page_cache:
